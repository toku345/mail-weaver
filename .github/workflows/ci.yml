name: OCaml CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 静的チェック・整形・ビルド・テスト (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DUNE_CACHE: disabled
    steps:
      - name: 対象コミットの取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 検証対象SHAの記録
        run: git rev-parse HEAD

      - name: OCaml・opam環境の準備
        id: setup
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ocaml-base-compiler.5.4.1
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#eba24de6376079a3f9dfa4a9c9ca842475cd1bbc
          opam-pin: false
          dune-cache: false
          # fork PRでは復元・保存とも無効にする。
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # 不整合時はこのprefixを更新して再実行する。
          cache-prefix: mail-weaver-v1

      - name: lockから依存を導入・検証
        id: deps
        run: |
          ./scripts/install-deps.sh "$OPAMROOT" "$GITHUB_WORKSPACE"
          opam repository list --cli=2.2 --root="$OPAMROOT" --switch="$GITHUB_WORKSPACE"

      - name: 静的チェック
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: opam exec -- ./scripts/check-static.sh

      - name: 整形チェック（変更なし）
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: opam exec -- dune build @fmt

      - name: ビルド
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: opam exec -- dune build

      - name: 全ユニットテスト（毎回実行）
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: opam exec -- dune runtest --force
