name: OCaml CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 静的チェック・整形・ビルド・テスト (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DUNE_CACHE: enabled-except-user-rules
    steps:
      - name: 対象コミットの取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 検証対象SHAの記録
        run: git rev-parse HEAD

      - name: OCaml・opam環境の準備
        id: setup
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ocaml-base-compiler.5.4.1
          opam-repositories: |
            default: git+https://github.com/ocaml/opam-repository.git#eba24de6376079a3f9dfa4a9c9ca842475cd1bbc
          opam-pin: false
          dune-cache: true
          # fork PRでは復元・保存とも無効にする。
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # 不整合時はこのprefixを更新して再実行する。
          cache-prefix: mail-weaver-v1

      - name: 固定バージョンの開発ツールを導入
        id: tools
        run: |
          opam install dune.3.24.2 ocamlformat.0.29.0
          opam --version
          opam exec -- ocamlc -version
          opam exec -- dune --version
          opam exec -- ocamlformat --version
          opam list --installed --columns=name,version

      - name: 静的チェック
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: opam exec -- ./scripts/check-static.sh

      - name: 整形チェック（変更なし）
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: opam exec -- dune build @fmt

      - name: ビルド
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: opam exec -- dune build

      - name: 全ユニットテスト（毎回実行）
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: opam exec -- dune runtest --force
